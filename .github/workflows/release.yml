name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  # Lets npm authenticate the workflow without a token (trusted publishing)
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Refuse to run with a pending changeset
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::A changeset is pending: version the packages locally with \`npx npm@11 run version-packages\`, commit one \`chore(<package>): bump version to vX.Y.Z\` per package and push."
            exit 1
          fi

      - uses: changesets/action@v2
        with:
          publish-script: npm run release
